<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      color: #2d3748;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 520px;
      padding: 32px;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1a202c;
    }

    .subtitle {
      color: #a0aec0;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #todoInput {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #todoInput:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .add-btn {
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }

    .add-btn:active { transform: translateY(0); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
    }

    .filter-btn {
      padding: 6px 14px;
      font-size: 0.875rem;
      background: transparent;
      border: none;
      color: #718096;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .filter-btn:hover { background: #f7fafc; color: #4a5568; }
    .filter-btn.active {
      background: #667eea;
      color: white;
      font-weight: 600;
    }

    #todoList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 10px;
      border-left: 4px solid #667eea;
      transition: background 0.15s, transform 0.15s, opacity 0.2s;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    li:hover {
      background: #edf2f7;
      transform: translateX(2px);
    }

    li.completed {
      opacity: 0.6;
      border-left-color: #48bb78;
    }

    li.completed span {
      text-decoration: line-through;
      color: #a0aec0;
    }

    li span {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    input[type="checkbox"]:checked {
      background: #48bb78;
      border-color: #48bb78;
    }

    input[type="checkbox"]:checked::after {
      content: "✓";
      color: white;
      font-size: 14px;
      font-weight: bold;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .delete {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: #a0aec0;
      font-size: 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .delete:hover {
      background: #fed7d7;
      color: #e53e3e;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .empty-state p { font-size: 0.95rem; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #edf2f7;
      font-size: 0.85rem;
      color: #718096;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: #e53e3e;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .clear-btn:hover { background: #fed7d7; }
    .clear-btn:disabled { color: #cbd5e0; cursor: not-allowed; }
    .clear-btn:disabled:hover { background: transparent; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 My Todo App</h1>
    <p class="subtitle">Stay organized, one task at a time</p>

    <div class="input-row">
      <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
      <button class="add-btn" onclick="addTodo()">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active')">Active</button>
      <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">Completed</button>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
      <span id="counter">0 tasks</span>
      <button class="clear-btn" id="clearBtn" onclick="clearCompleted()" disabled>Clear completed</button>
    </div>
  </div>

  <script>
    const API = '/api/todos';
    let allTodos = [];
    let currentFilter = 'all';

    async function loadTodos() {
      try {
        const res = await fetch(API);
        allTodos = await res.json();
        render();
      } catch (err) {
        console.error('Failed to load todos:', err);
      }
    }

    function render() {
      const list = document.getElementById('todoList');
      const counter = document.getElementById('counter');
      const clearBtn = document.getElementById('clearBtn');

      let visible = allTodos;
      if (currentFilter === 'active')    visible = allTodos.filter(t => !t.completed);
      if (currentFilter === 'completed') visible = allTodos.filter(t =>  t.completed);

      // counter
      const remaining = allTodos.filter(t => !t.completed).length;
      counter.textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;

      // clear button state
      const hasCompleted = allTodos.some(t => t.completed);
      clearBtn.disabled = !hasCompleted;

      // list
      list.innerHTML = '';

      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `
          <div class="icon">${currentFilter === 'completed' ? '✅' : '📋'}</div>
          <p>${getEmptyMessage()}</p>`;
        list.appendChild(empty);
        return;
      }

      visible.forEach(todo => {
        const li = document.createElement('li');
        if (todo.completed) li.classList.add('completed');
        li.innerHTML = `
          <input type="checkbox" ${todo.completed ? 'checked' : ''}
                 onchange="toggleTodo('${todo._id}', this.checked)">
          <span>${escapeHtml(todo.text)}</span>
          <button class="delete" onclick="deleteTodo('${todo._id}')" title="Delete">×</button>`;
        list.appendChild(li);
      });
    }

    function getEmptyMessage() {
      if (currentFilter === 'active')    return 'No active tasks — nice work!';
      if (currentFilter === 'completed') return 'No completed tasks yet';
      return 'Nothing here yet. Add your first task above!';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;

      try {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        input.value = '';
        input.focus();
        await loadTodos();
      } catch (err) {
        console.error('Failed to add todo:', err);
      }
    }

    async function toggleTodo(id, completed) {
      try {
        await fetch(`${API}/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });
        await loadTodos();
      } catch (err) {
        console.error('Failed to toggle todo:', err);
      }
    }

    async function deleteTodo(id) {
      try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        await loadTodos();
      } catch (err) {
        console.error('Failed to delete todo:', err);
      }
    }

    async function clearCompleted() {
      const completed = allTodos.filter(t => t.completed);
      for (const t of completed) {
        await fetch(`${API}/${t._id}`, { method: 'DELETE' });
      }
      await loadTodos();
    }

    document.getElementById('todoInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') addTodo();
    });

    loadTodos();
  </script>
</body>
</html>
